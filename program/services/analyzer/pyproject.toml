[project]
name = "liming-zhiyao-analyzer"
version = "0.1.0"
description = "Deterministic media and performance analysis service for Liming Zhiyao"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx==0.28.1",
  "instructor>=1.15,<2",
  "openai>=2.8,<3",
  "pydantic>=2.12,<3",
  "mcp>=2.0,<3",
  "minimax-coding-plan-mcp==0.0.5",
  "Pillow>=10,<13",
  "yt-dlp>=2026.7.4",
]

[project.scripts]
liming-analyzer = "liming_analyzer.__main__:main"

[project.optional-dependencies]
media = [
  "funasr>=1.4,<2",
  "torch>=2.11,<2.12",
  "torchaudio>=2.11,<2.12",
  "paddleocr>=3.7,<4",
  # PaddlePaddle 3.3.x can fail to load PP-OCRv5 inference.json on Windows.
  # Keep the runtime on the version recommended by the PaddleOCR installation guide.
  "paddlepaddle==3.2.0",
  # PaddleX already uses the contrib build. Installing another OpenCV wheel beside it
  # overwrites the same cv2 package and makes Windows installations order-dependent.
  "opencv-contrib-python==4.10.0.84",
  "faster-whisper>=1.1,<2",
  "av==16.1.0",
]
dev = ["ruff>=0.12,<1", "pytest>=9.1,<10", "cryptography>=47,<51"]

[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["liming_analyzer*"]
exclude = ["*.node_modules*", "*.tests*"]

[tool.setuptools.package-data]
"liming_analyzer" = ["resources/*.json", "resources/*.md"]
"liming_analyzer.douyin_collector" = ["node/*.mjs", "node/*.json", "LICENSES/*.txt", "README.md", "SOURCE.json"]
