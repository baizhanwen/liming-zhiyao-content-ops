name: Check Windows runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: program
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: program/package-lock.json
      - id: dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Windows file publication and analyzer control
        run: |
          python -m venv .local/runtime-tests
          $testPython = Join-Path (Get-Location) '.local/runtime-tests/Scripts/python.exe'
          $requirements = & $testPython -c "import tomllib; data = tomllib.load(open('services/analyzer/uv.lock', 'rb')); print('\n'.join(package['name'] + '==' + package['version'] for package in data['package'] if package['name'] in {'pytest', 'httpx'}))"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read locked test dependencies.' }
          & $testPython -m pip install --disable-pip-version-check @requirements
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare isolated runtime tests.' }
          $env:PYTHONPATH = Join-Path (Get-Location) 'services/analyzer'
          & $testPython -m pytest services/analyzer/tests/test_analyzer_local_runtime.py services/analyzer/tests/test_analyzer_windows_control.py services/analyzer/tests/collector/test_adapter.py services/analyzer/tests/test_skill_collect_source.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Windows file publication or analyzer control regression failed.' }
      - name: Verify Windows entry points and transfer fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --test tests/analyzer-collector-runtime.test.mjs tests/analyzer-environment-bridge.test.mjs tests/analyzer-windows-control.test.mjs tests/local-runtime-identity.test.mjs tests/local-port-isolation.test.mjs tests/runtime-configuration-startup.test.mjs tests/material-transfer-roundtrip.test.mjs
