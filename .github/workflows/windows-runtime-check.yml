name: Check Windows runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: program
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: program/package-lock.json
      - id: dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Windows file publication and analyzer control
        run: |
          python -m venv .local/runtime-tests
          $testPython = Join-Path (Get-Location) '.local/runtime-tests/Scripts/python.exe'
          # SDK/schema/image dependencies only; do not install ASR, Torch or Paddle.
          $requirements = & $testPython -c "import tomllib; data = tomllib.load(open('services/analyzer/uv.lock', 'rb')); print('\n'.join(package['name'] + '==' + package['version'] for package in data['package'] if package['name'] in {'pytest', 'httpx', 'openai', 'instructor', 'pydantic', 'pypinyin', 'pillow', 'setuptools'}))"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read locked test dependencies.' }
          & $testPython -m pip install --disable-pip-version-check @requirements
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare isolated runtime tests.' }
          "PYTHON=$testPython" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:PYTHONPATH = Join-Path (Get-Location) 'services/analyzer'
          & $testPython -m pytest services/analyzer/tests/test_analyzer_local_runtime.py services/analyzer/tests/test_analyzer_windows_control.py services/analyzer/tests/collector/test_adapter.py services/analyzer/tests/test_skill_collect_source.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Windows file publication or analyzer control regression failed.' }
          & $testPython -m pytest services/analyzer/tests/test_canonical_transcript.py services/analyzer/tests/test_canonical_review.py services/analyzer/tests/test_instructor_single_attempt.py services/analyzer/tests/test_reviewed_analysis.py services/analyzer/tests/test_content_review.py services/analyzer/tests/test_content_module_protocol.py services/analyzer/tests/test_unified_analysis.py services/analyzer/tests/test_vision_batch_runtime.py services/analyzer/tests/test_visual_overlap.py services/analyzer/tests/test_pipeline_checkpoint_synchronization.py services/analyzer/tests/test_unified_manual_batching.py services/analyzer/tests/test_content_analysis.py services/analyzer/tests/test_content_metrics.py services/analyzer/tests/test_no_audio_content.py services/analyzer/tests/test_content_provider_integration.py services/analyzer/tests/test_content_packaging.py services/analyzer/tests/test_visual_evidence.py services/analyzer/tests/test_ffmpeg.py services/analyzer/tests/test_minimax_vision.py services/analyzer/tests/test_minimax_flash_compat.py services/analyzer/tests/test_providers.py services/analyzer/tests/test_correction_token_retry.py services/analyzer/tests/test_model_calls.py services/analyzer/tests/test_frame_boundaries.py services/analyzer/tests/test_opening_frame_origin.py services/analyzer/tests/test_retired_analysis_dimensions.py services/analyzer/tests/test_ocr_only_review_analysis.py services/analyzer/tests/test_module_response_repair.py services/analyzer/tests/test_compact_shape_repair.py services/analyzer/tests/test_compact_evidence_repair.py services/analyzer/tests/test_report_revalidation.py services/analyzer/tests/test_content_report_contract.py services/analyzer/tests/test_canonical_text_contract.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Windows unified content analysis or wheel resource regression failed.' }
      - name: Verify Windows entry points and transfer fixtures
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --test --test-reporter=tap tests/analyzer-collector-runtime.test.mjs tests/analyzer-environment-bridge.test.mjs tests/local-runtime-identity.test.mjs tests/local-port-isolation.test.mjs tests/maintenance-concurrency.test.mjs tests/runtime-configuration-startup.test.mjs tests/material-transfer-roundtrip.test.mjs tests/reviewed-analysis-contract.test.mjs tests/analysis-module-retry.test.mjs tests/analysis-quality.test.mjs tests/unified-model-calls.test.mjs tests/content-comparison.test.mjs tests/content-report-contract.test.mjs tests/canonical-text-contract.test.mjs tests/library-content-metadata.test.mjs tests/media-error-view.test.mjs
  native-node-matrix:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "22.23.2", "24.20.0"]
    defaults:
      run:
        working-directory: program
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: program/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Verify supported runtime policy and native Windows lifecycle
        env:
          LMZY_VERIFY_OFFICIAL_NODE: ${{ matrix.node == '22.23.2' && '1' || '0' }}
        run: node --test --test-reporter=tap tests/node-runtime-policy.test.mjs tests/node-portable-runtime.test.mjs tests/shared-launcher.test.mjs tests/analyzer-windows-control.test.mjs
