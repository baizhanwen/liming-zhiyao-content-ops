name: Build full Windows download

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New full-v release tag (must have matching release notes)"
        required: true
        default: "full-v20261117.1"
        type: string
  push:
    tags:
      - "full-v*"

permissions:
  contents: read

concurrency:
  group: full-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CI: "1"
      WRANGLER_SEND_METRICS: "false"
      DELIVERY_VERIFY_ENVIRONMENT_BRIDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release version and notes
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:RELEASE_TAG_INPUT }
          if ($tag -notmatch '^full-v[0-9]{8}\.[0-9]+$') { throw 'A versioned full-v release tag is required.' }
          $notesFile = Join-Path (Get-Location) ("program/docs/releases/" + $tag + '.md')
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) { throw 'Versioned release notes are missing.' }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          # The D1 unit-test adapter requires node:sqlite's length-aware text reads.
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: program/package-lock.json
      - name: Install development dependencies
        working-directory: program
        run: npm ci --no-audit --no-fund
      - name: Check isolated Python environment management
        working-directory: program
        run: |
          python -m venv .local/runtime-tests
          $testPython = Join-Path (Get-Location) '.local/runtime-tests/Scripts/python.exe'
          # Offline contract tests need the SDK/schema stack, never the large ASR/media extras.
          $testRequirements = & $testPython -c "import tomllib; data = tomllib.load(open('services/analyzer/uv.lock', 'rb')); print('\n'.join(package['name'] + '==' + package['version'] for package in data['package'] if package['name'] in {'pytest', 'httpx', 'openai', 'instructor', 'pydantic', 'pypinyin', 'pillow', 'setuptools'}))"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the locked test dependency.' }
          & $testPython -m pip install --disable-pip-version-check @testRequirements
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare the isolated runtime tests.' }
          "PYTHON=$testPython" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:PYTHONPATH = Join-Path (Get-Location) 'services/analyzer'
          & $testPython -m pytest services/analyzer/tests/test_analyzer_local_runtime.py services/analyzer/tests/test_analyzer_windows_control.py services/analyzer/tests/test_prepare_analyzer_models.py services/analyzer/tests/collector/test_adapter.py services/analyzer/tests/collector/test_browser_capture_cleanup.py services/analyzer/tests/test_processing_health.py services/analyzer/tests/test_worker.py services/analyzer/tests/test_skill_collect_source.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Python runtime isolation tests failed.' }
          & $testPython -m pytest services/analyzer/tests/test_canonical_transcript.py services/analyzer/tests/test_canonical_review.py services/analyzer/tests/test_instructor_single_attempt.py services/analyzer/tests/test_reviewed_analysis.py services/analyzer/tests/test_content_review.py services/analyzer/tests/test_content_module_protocol.py services/analyzer/tests/test_unified_analysis.py services/analyzer/tests/test_vision_batch_runtime.py services/analyzer/tests/test_visual_overlap.py services/analyzer/tests/test_visual_mode.py services/analyzer/tests/test_visual_sampling.py services/analyzer/tests/test_vision_only_provider.py services/analyzer/tests/test_pipeline_checkpoint_synchronization.py services/analyzer/tests/test_unified_manual_batching.py services/analyzer/tests/test_content_analysis.py services/analyzer/tests/test_partial_failure_metadata.py services/analyzer/tests/test_content_length_recovery.py services/analyzer/tests/test_content_metrics.py services/analyzer/tests/test_no_audio_content.py services/analyzer/tests/test_content_provider_integration.py services/analyzer/tests/test_content_packaging.py services/analyzer/tests/test_visual_evidence.py services/analyzer/tests/test_ffmpeg.py services/analyzer/tests/test_minimax_vision.py services/analyzer/tests/test_minimax_flash_compat.py services/analyzer/tests/test_providers.py services/analyzer/tests/test_correction_token_retry.py services/analyzer/tests/test_model_calls.py services/analyzer/tests/test_frame_boundaries.py services/analyzer/tests/test_opening_frame_origin.py services/analyzer/tests/test_retired_analysis_dimensions.py services/analyzer/tests/test_ocr_only_review_analysis.py services/analyzer/tests/test_module_response_repair.py services/analyzer/tests/test_compact_shape_repair.py services/analyzer/tests/test_compact_evidence_repair.py services/analyzer/tests/test_report_revalidation.py services/analyzer/tests/test_content_report_contract.py services/analyzer/tests/test_canonical_text_contract.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Windows unified content analysis or wheel resource regression failed.' }
      - name: Check offline mocked GPU and durable ASR contracts
        working-directory: program
        run: |
          $testPython = Join-Path (Get-Location) '.local/runtime-tests/Scripts/python.exe'
          $env:PYTHONPATH = Join-Path (Get-Location) 'services/analyzer'
          # GPU checks use offline mocks; real CUDA inference requires the target machine's diagnostic JSON.
          & $testPython -m pytest services/analyzer/tests/test_cuda_runtime.py services/analyzer/tests/test_prepare_analyzer_cuda.py services/analyzer/tests/test_check_analyzer_cuda.py services/analyzer/tests/test_prepare_analyzer_models.py services/analyzer/tests/test_diagnose_whisper_gpu.py services/analyzer/tests/test_gpu_diagnostics.py services/analyzer/tests/test_faster_whisper_asr.py services/analyzer/tests/test_transcript_checkpoints.py services/analyzer/tests/test_process_runtime.py services/analyzer/tests/test_windows_runtime.py services/analyzer/tests/test_durable_source_http.py services/analyzer/tests/test_reference_overflow_recovery.py services/analyzer/tests/test_transcript_review_mode.py services/analyzer/tests/test_quality_speech.py::test_ct2_auto_recovers_gpu_failures_without_partial_or_duplicate_output -q
          if ($LASTEXITCODE -ne 0) { throw 'Offline mocked GPU, durable ASR, stage budget, EOF, reference recovery or raw transcript contract failed.' }
      - name: Check source and run regression tests
        working-directory: program
        run: npm test
      - name: Use the customer installer runtime for package acceptance
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Build and verify isolated full package
        run: |
          & ./program/scripts/prepare-delivery.ps1 -Distribution github -DestinationRoot "$env:RUNNER_TEMP/full-package"
          if ($LASTEXITCODE -ne 0) { throw 'Full package verification failed.' }
      - name: Collect verified release assets
        run: |
          $archives = @(Get-ChildItem "$env:RUNNER_TEMP/full-package" -Filter '*.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected one verified package.' }
          $assets = "$env:RUNNER_TEMP/release-assets"
          New-Item -ItemType Directory -Force $assets | Out-Null
          $zip = Join-Path $assets 'LimingZhiyao-Windows-Full.zip'
          Copy-Item -LiteralPath $archives[0].FullName -Destination $zip
          $candidate = $archives[0].FullName.Substring(0, $archives[0].FullName.Length - 4)
          $report = Join-Path $candidate 'LimingZhiyao/delivery-validation.json'
          $validation = Get-Content -Raw -LiteralPath $report | ConvertFrom-Json
          if (-not $validation.passed) { throw 'Package validation report is not passed.' }
          Copy-Item -LiteralPath $report -Destination (Join-Path $assets 'delivery-validation.json')
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  LimingZhiyao-Windows-Full.zip`n")
      - name: Retain verified download
        uses: actions/upload-artifact@v4
        with:
          name: LimingZhiyao-Windows-Full
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain synthetic acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-acceptance-diagnostics
          path: program/.local/dv/**/verification.log
          if-no-files-found: ignore
          retention-days: 3
  cold-install-and-transcribe:
    needs: release
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      WRANGLER_SEND_METRICS: "false"
      PYTHONUTF8: "1"
      UV_LINK_MODE: hardlink
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - uses: actions/download-artifact@v4
        with:
          name: LimingZhiyao-Windows-Full
          path: ${{ runner.temp }}/release-assets
      - name: Unpack the exact distribution into an empty directory
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Free, Used
          $archive = Join-Path $env:RUNNER_TEMP release-assets/LimingZhiyao-Windows-Full.zip
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne ((Get-Content "$archive.sha256") -split ' ')[0]) { throw 'ZIP hash mismatch.' }
          "ACCEPTANCE_ZIP_SHA256=$hash" >> $env:GITHUB_ENV
          New-Item D:\qw -ItemType Directory -ErrorAction Stop | Out-Null
          [IO.Compression.ZipFile]::ExtractToDirectory($archive, 'D:\qw', [Text.Encoding]::UTF8)
          Set-Location D:\qw\LimingZhiyao
          foreach ($document in @('docs/产品使用手册.html', 'docs/产品使用手册.md', 'docs/operations/备份恢复与升级操作.md', 'docs/电商素材使用说明.md', 'docs/releases/full-v20261117.1.md')) {
            if (-not (Test-Path -LiteralPath $document -PathType Leaf)) { throw "Packaged document missing: $document" }
          }
          foreach ($item in @('.local', '.wrangler', 'services/analyzer/.venv', 'node_modules', 'scripts/verify-windows-qwen.mjs')) {
            if (Test-Path $item) { throw "Unexpected bundled file or prior installation: $item" }
          }
      - name: Run the shipped first-install entry and prepare a separate browser driver
        working-directory: D:\qw\LimingZhiyao
        run: |
          cmd.exe /d /c "setup-local.bat < nul"
          if ($LASTEXITCODE) { throw 'Packaged web setup failed.' }
          $driver = Join-Path $env:RUNNER_TEMP acceptance-driver
          New-Item $driver -ItemType Directory | Out-Null
          Copy-Item services/analyzer/liming_analyzer/douyin_collector/node/package*.json $driver
          npm ci --prefix $driver --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { throw 'Browser driver installation failed.' }
          "ACCEPTANCE_PLAYWRIGHT=$driver/node_modules/playwright/index.mjs" >> $env:GITHUB_ENV
      - name: Click one-click setup and extract fresh manuscripts
        working-directory: D:\qw\LimingZhiyao
        run: node "$env:GITHUB_WORKSPACE/program/scripts/verify-windows-qwen.mjs"
      - name: Retain exact-package Windows acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-qwen-acceptance
          path: D:/qw/LimingZhiyao/.local/verification/windows-qwen/result.json
          retention-days: 14
          if-no-files-found: ignore
  publish:
    needs: [release, cold-install-and-transcribe]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: LimingZhiyao-Windows-Full
          path: ${{ runner.temp }}/release-assets
      - uses: actions/download-artifact@v4
        with:
          name: windows-qwen-acceptance
          path: ${{ runner.temp }}/windows-acceptance
      - name: Verify exact accepted package and publish GitHub download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:RELEASE_TAG_INPUT }
          if ($tag -notmatch '^full-v[0-9]{8}\.[0-9]+$') { throw 'A versioned full-v release tag is required.' }
          $notesFile = Join-Path (Get-Location) ("program/docs/releases/" + $tag + '.md')
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) { throw 'Versioned release notes are missing.' }
          $assetRoot = Join-Path $env:RUNNER_TEMP release-assets
          $zip = Join-Path $assetRoot LimingZhiyao-Windows-Full.zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne ((Get-Content "$zip.sha256") -split ' ')[0]) { throw 'ZIP hash mismatch.' }
          $validation = Get-Content -Raw -LiteralPath (Join-Path $assetRoot delivery-validation.json) | ConvertFrom-Json
          if ($validation.passed -ne $true) { throw 'Isolated package validation did not pass.' }
          $reportPath = Join-Path $env:RUNNER_TEMP windows-acceptance/result.json
          $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json
          if ($report.passed -ne $true -or $report.revision -ne $env:GITHUB_SHA -or $report.zipSha256 -ne $hash) { throw 'Windows acceptance does not match this revision and ZIP.' }
          foreach ($name in @('single', 'multi')) {
            $extractions = @($report.extractions | Where-Object { $_.name -eq $name -and $_.status -eq 'completed' })
            if ($extractions.Count -ne 1) { throw "Windows transcription acceptance missing: $name" }
          }
          Copy-Item -LiteralPath $reportPath -Destination (Join-Path $assetRoot windows-qwen-acceptance.json)
          $assets = @(Get-ChildItem -LiteralPath $assetRoot -File | ForEach-Object FullName)
          gh release create $tag @assets --target $env:GITHUB_SHA --title '利明智耀工作台 · 完整开发版' --notes-file $notesFile --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
